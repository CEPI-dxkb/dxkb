packages:
  - .
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - archaeopteryx@3.28.0
trustPolicy: no-downgrade
trustPolicyExclude:
  - "@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1"
  - "eslint-import-resolver-typescript@3.10.1"
  - "semver@6.3.1"
  - "undici-types@6.21.0"
overrides:
  webpack-bundle-analyzer@3.9.0>ejs: 3.1.10
  request@2.88.2>form-data: 2.5.6
  compression-webpack-plugin@3.1.0>serialize-javascript: 7.1.4
  auspice@3.2.0>css-loader: 7.1.4
  auspice@3.2.0>dompurify: 3.4.17
  auspice@3.2.0>maplibre-gl: 6.16.0
  auspice@3.2.0>webpack-dev-middleware: 8.6.0
  # SheetJS stopped publishing xlsx to npm at 0.18.5, and fixed releases
  # (>= 0.19.3, GHSA-4r6h-8v6p-xvw6) ship only from the SheetJS CDN.
  # blockExoticSubdeps forbids a URL below the root, so auspice's edge is
  # removed and its bundler resolves the root devDependency instead.
  auspice@3.2.0>xlsx: "-"
  # minimatch < 11.0.1 has GHSA-g3hv-75wg-m249. glob < 14 reads minimatch's
  # RegExp pattern parts, which minimatch 11 replaced, so glob moves with it.
  "@typescript-eslint/typescript-estree@8.72.1>minimatch": 11.0.5
  workbox-build@7.4.1>glob: 14.0.3
  react-tooltip@4.5.1>uuid: 11.1.1
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": true
  core-js: false
  ejs: false
  esbuild: true
  msw: true
  prisma: true
  sharp: true
  styled-components: false
  unrs-resolver: true
patchedDependencies:
  '@jbrowse/product-core@5.0.0-beta.20': patches/@jbrowse__product-core@5.0.0-beta.20.patch
  '@visx/zoom@4.0.0': patches/@visx__zoom@4.0.0.patch
  auspice@3.2.0: patches/auspice@3.2.0.patch
  molstar: patches/molstar.patch
