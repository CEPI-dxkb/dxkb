name: Playwright Visual Regression Tests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Cancel any in-progress e2e run for the same PR when a new one starts.
# This ensures that when sync-linux-snapshots commits fresh PNGs and triggers
# a new synchronize event, the stale first run is killed before it can fail.
concurrency:
  group: e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sync-linux-snapshots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-jammy
    # Only runs for PRs from the same repo — GITHUB_TOKEN cannot push to forks
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build
        env:
          # NEXT_PUBLIC_* vars inline at build time, so the loopback Data API
          # (mirrored from .env.e2e.test, which is only loaded at server-start and
          # thus can't reach client bundles) must be baked here for client-side
          # fetches like the taxonomy tree. Port 3020 is the repo-wide e2e default
          # (playwright.config.ts, start-webserver.mjs); keep in sync if it changes.
          NEXT_PUBLIC_DATA_API: "http://127.0.0.1:3020/api/e2e-mock/data"

      - name: Set up auth state
        run: pnpm e2e --project=setup-signed-in
        env:
          CI: "true"
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Regenerate linux snapshots
        run: pnpm e2e:update-snapshots --project=chromium --project=firefox --project=webkit --grep "visual regression"
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Commit updated snapshots
        id: commit
        working-directory: ${{ github.workspace }}
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__snapshots__/
          if git diff --staged --quiet; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update linux e2e snapshots"
            git push origin "HEAD:refs/heads/$HEAD_BRANCH"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  e2e:
    needs: [sync-linux-snapshots]
    # Run even when sync-linux-snapshots is skipped (fork PRs)
    if: always()
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-jammy

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    env:
      BROWSER: ${{ matrix.browser }}

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          # Use the SHA after snapshot sync (may be a new commit); fall back to
          # the trigger SHA for fork PRs where sync-linux-snapshots was skipped.
          ref: ${{ needs.sync-linux-snapshots.outputs.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build
        env:
          # See note on the sync-linux-snapshots build: NEXT_PUBLIC_* inlines at
          # build time, so the loopback Data API must be baked for client fetches.
          NEXT_PUBLIC_DATA_API: "http://127.0.0.1:3020/api/e2e-mock/data"

      - name: Run e2e tests
        run: pnpm e2e --project=setup-signed-in --project="$BROWSER"
        env:
          CI: "true"
          HOME: /root
          # Server components on /workspace/[username]/** call getRequiredEnv("WORKSPACE_GUIDE_URL")
          # at request time. .env is gitignored so CI has no default; set a placeholder here so the
          # pages render (the value is only used as a link href, never fetched by the tests).
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            .misc/playwright-report/
            .misc/test-results/
          retention-days: 14
