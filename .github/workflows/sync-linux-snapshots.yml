name: Sync Linux Reference Snapshots

on:
  push:
    branches-ignore:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  sync-linux-snapshots:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build

      - name: Set up auth state
        run: pnpm e2e --project=setup-signed-in
        env:
          CI: "true"
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Regenerate linux snapshots
        run: pnpm e2e:update-snapshots --project=chromium --project=firefox --project=webkit --grep "visual regression|matches the visual snapshot"
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Commit updated snapshots
        env:
          BRANCH_REF: ${{ github.ref }}
        run: |
          git config --global --add safe.directory "$(pwd)"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add e2e/__snapshots__/
          git diff --staged --quiet || (git commit -m "chore: update linux e2e snapshots" && git push origin "HEAD:$BRANCH_REF")
