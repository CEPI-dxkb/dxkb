name: Accessibility (WCAG 2.1 AA) Tests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job per spec file — parallel CI runtime (plan Q16).
  a11y-routes-sweep:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.62.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build
        env:
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"
          # NEXT_PUBLIC_* inlines at build time, so the loopback Data API (mirrored
          # from .env.e2e.test, loaded only at server-start and thus unreachable by
          # client bundles) must be baked here for client-side fetches like the
          # taxonomy tree — otherwise useTaxonChildren throws and crashes the
          # page. (The interactions graph no longer needs it: it loads through the
          # same-origin Data API gateway.) Matches pnpm-e2e.yml; keep port 3020 in
          # sync with playwright.a11y.config.ts / start-webserver.mjs.
          NEXT_PUBLIC_DATA_API: "http://127.0.0.1:3020/api/e2e-mock/data"

      - name: Set up auth state
        run: pnpm exec playwright test --config playwright.a11y.config.ts --project=a11y-setup-signed-in
        env:
          CI: "true"
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      # coverage.meta.spec.ts is the single enforcement point for "routes.ts is the
      # one coverage list", and it carries no project filter of its own — so before
      # this step it reached CI only through a11y:tripwire, i.e. only if the Firefox
      # half of the flakiest job in the matrix ran. It belongs on a chromium job.
      #
      # Attached to this job rather than given a job of its own because it checks the
      # same registry the sweep below consumes, and a new job would repeat the whole
      # install+build for a check that runs in seconds.
      #
      # It MUST stay above the routes sweep. Playwright clears `outputDir`
      # (a11y-results/) at the start of every run and the json reporter rewrites
      # a11y-report/results.json, so running this after the sweep deletes the sweep's
      # traces, screenshots and videos before the upload step and replaces its results
      # with these eight tests. Verified locally: a sentinel file under a11y-results/
      # does not survive `pnpm a11y:meta`. Both steps carry `!cancelled()` so neither
      # failure can mask the other.
      - name: Check route registry coverage accounting (chromium)
        if: ${{ !cancelled() }}
        run: pnpm a11y:meta
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Run routes sweep (chromium)
        if: ${{ !cancelled() }}
        run: pnpm a11y:routes
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-routes-sweep
          path: |
            a11y-report/
            a11y-results/
          retention-days: 14

  a11y-deep-tier:
