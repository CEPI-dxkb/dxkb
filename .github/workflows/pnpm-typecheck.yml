name: Typecheck Verification

on:
  pull_request:
    # Title and description edits (often by bots) change no code and used to
    # start a duplicate run (no concurrency group). A change of base branch no
    # longer re-triggers this workflow: push a commit, or close and reopen the
    # pull request, to cover that. A re-run does not: it checks out the merge
    # commit of the original event.
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
      - test
      - dev
      - "DXKBCORE-*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [26]

    steps:
      - name: Code Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck project
        run: pnpm typecheck
