name: Accessibility (WCAG 2.1 AA) Tests

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
    branches:
      - main
      - test
      - dev

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: a11y-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # One job per spec file — parallel CI runtime (plan Q16).
  a11y-routes-sweep:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build app
        run: pnpm build
        env:
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"
          # NEXT_PUBLIC_* inlines at build time, so the loopback Data API (mirrored
          # from .env.e2e.test, loaded only at server-start and thus unreachable by
          # client bundles) must be baked here for client-side fetches like the
          # taxonomy tree — otherwise useTaxonChildren throws and crashes the
          # page. (The interactions graph no longer needs it: it loads through the
          # same-origin Data API gateway.) Matches pnpm-e2e.yml; keep port 3020 in
          # sync with playwright.a11y.config.ts / start-webserver.mjs.
          NEXT_PUBLIC_DATA_API: "http://127.0.0.1:3020/api/e2e-mock/data"

      # coverage.meta.spec.ts is the single enforcement point for "routes.ts is the
      # one coverage list" plus the baseline/reflowSkip stale-key guard. It is
      # attached to this job rather than given one of its own because it checks the
      # same registry the sweep below consumes, and a new job would repeat the whole
      # install for a check that runs in seconds.
      #
      # Its position relative to the sweep no longer affects the artifacts either
      # step produces. `pnpm a11y:meta` runs under playwright.a11y.meta.config.ts,
      # which has its own outputDir (.misc/a11y-meta-results/) and JSON report
      # (.misc/a11y-meta-report/), so the outputDir Playwright clears at the start
      # of a run and the JSON file its reporter rewrites are never the sweep's.
      # Both steps still carry `!cancelled()` so neither failure masks the other.
      #
      # It needs no browser, no web server and no build: nothing in the spec
      # navigates, so the config declares no webServer and the step sets no
      # browser-cache HOME or server env.
      - name: Check route registry coverage accounting (browser-free)
        if: ${{ !cancelled() }}
        run: pnpm a11y:meta
        env:
          CI: "true"

      - name: Run routes sweep (chromium)
        if: ${{ !cancelled() }}
        run: pnpm a11y:routes
        env:
          CI: "true"
          HOME: /root
          WORKSPACE_GUIDE_URL: "https://www.bv-brc.org/docs/quick_references/workspace_groups_upload.html"

      - name: Upload a11y report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report-routes-sweep
          path: |
            .misc/a11y-report/
            .misc/a11y-results/
            .misc/a11y-meta-report/
            .misc/a11y-meta-results/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  a11y-deep-tier:
